# C9 exercise pack c2-a, compose file 1 of 2. Runs on any Docker host; compose.harness.yaml adds runsc and limits.
name: pw-c2-a
configs:
  toxiproxy:
    content: '[{"name":"postgres","listen":"0.0.0.0:5432","upstream":"postgres:5432"}]'
services:
  postgres:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    networks:
    - infra
    healthcheck:
      test:
      - CMD
      - pg_isready
      - -U
      - app
      - -d
      - app
      interval: 2s
      retries: 30
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0@sha256:9378ed52a28bc50edc1350f936f518f31fa95f0d15917d6eb40b8e376d1a214e
    command:
    - -host=127.0.0.1
    - -config=/toxiproxy.json
    configs:
    - source: toxiproxy
      target: /toxiproxy.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
      - CMD
      - /toxiproxy-cli
      - inspect
      - postgres
      interval: 2s
      retries: 30
    networks:
      infra: {}
      app:
        ipv4_address: 10.250.0.10
        aliases:
        - postgres.pw.internal
  api:
    build: services/api
    environment:
      DATABASE_URL: postgres://app:app@postgres.pw.internal:5432/app?sslmode=disable
      API_URL: http://api.pw.internal:8000
      PORT: '8000'
    extra_hosts:
    - postgres.pw.internal:10.250.0.10
    - api.pw.internal:10.250.0.20
    - web.pw.internal:10.250.0.30
    networks:
      app:
        ipv4_address: 10.250.0.20
        aliases:
        - api.pw.internal
    depends_on:
      toxiproxy:
        condition: service_healthy
  worker:
    build: services/worker
    environment:
      DATABASE_URL: postgres://app:app@postgres.pw.internal:5432/app?sslmode=disable
      API_URL: http://api.pw.internal:8000
    extra_hosts:
    - postgres.pw.internal:10.250.0.10
    - api.pw.internal:10.250.0.20
    - web.pw.internal:10.250.0.30
    networks:
      app: {}
    depends_on:
      toxiproxy:
        condition: service_healthy
  web:
    build: services/web
    environment:
      DATABASE_URL: postgres://app:app@postgres.pw.internal:5432/app?sslmode=disable
      API_URL: http://api.pw.internal:8000
      PORT: '3000'
    extra_hosts:
    - postgres.pw.internal:10.250.0.10
    - api.pw.internal:10.250.0.20
    - web.pw.internal:10.250.0.30
    networks:
      app:
        ipv4_address: 10.250.0.30
        aliases:
        - web.pw.internal
    depends_on:
      toxiproxy:
        condition: service_healthy
  smoke:
    image: ghcr.io/pairwise-interviews/c2-a-smoke:1.0.0
    profiles:
    - smoke
    volumes:
    - ./.pw-out:/pw-out
    extra_hosts:
    - postgres.pw.internal:10.250.0.10
    - api.pw.internal:10.250.0.20
    - web.pw.internal:10.250.0.30
    networks:
    - app
networks:
  app:
    ipam:
      config:
      - subnet: 10.250.0.0/24
  infra:
    internal: true
